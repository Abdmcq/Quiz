<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صيانة النظام</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #080a0f;
            color: #ffffff;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* حل مشكلة النقاط: توفير مساحة علوية وسفلية كبيرة جداً داخل حاوية النص */
        .text-safe-zone {
            padding: 60px 20px; /* مساحة أمان علوية وسفلية */
            line-height: 1.8;   /* تباعد أسطر واسع لضمان ظهور النقاط */
        }

        .main-title {
            background: linear-gradient(to bottom, #ffffff 40%, #64748b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
        }

        /* انيميشن التروس (Maintenance Gears) */
        .gears-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
            opacity: 0.6;
        }

        .gear {
            animation: spin 4s linear infinite;
            color: #4f46e5;
        }

        .gear-slow {
            animation: spin-reverse 6s linear infinite;
            color: #6366f1;
            margin-top: -10px;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes spin-reverse {
            from { transform: rotate(360deg); }
            to { transform: rotate(0deg); }
        }

        /* تصميم كروت التليجرام */
        .contact-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .contact-card:hover {
            border-color: #4f46e5;
            background: rgba(79, 70, 229, 0.05);
            transform: translateY(-5px);
        }

        .shimmer {
            position: relative;
            overflow: hidden;
        }

        .shimmer::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            100% { left: 100%; }
        }
    </style>
</head>
<body>

    <div class="relative z-10 w-full max-w-4xl text-center px-4">
        
        <!-- حاوية العنوان مع تباعد أسطر عالي لحل مشكلة النقاط -->
        <div class="text-safe-zone">
            <h1 class="main-title text-5xl md:text-8xl font-black tracking-tight">
                الموقع قيد الصيانة
            </h1>
        </div>

        <!-- الأنميشن (التروس المتحركة) -->
        <div class="gears-container mb-12">
            <!-- ترس كبير -->
            <svg class="gear w-12 h-12" fill="none" viewBox="0 0 24 24" stroke="currentColor">

                <circle cx="12" cy="12" r="3" stroke-width="1.5" />
            </svg>
            <!-- ترس صغير -->
            <svg class="gear-slow w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                <circle cx="12" cy="12" r="3" stroke-width="1.5" />
            </svg>
        </div>

        <!-- روابط التليجرام -->
        <div class="flex flex-col md:flex-row gap-4 justify-center items-stretch max-w-xl mx-auto">
            
            <a href="https://t.me/Ans2co1bot" target="_blank" class="contact-card shimmer flex-1 p-5 rounded-3xl flex items-center gap-4 text-right">
                <div class="p-3 bg-indigo-500/10 rounded-2xl text-indigo-400">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69.01-.03.01-.14-.07-.2-.08-.06-.19-.04-.27-.02-.12.02-1.96 1.25-5.54 3.69-.52.36-.99.53-1.41.52-.46-.01-1.35-.26-2.01-.48-.81-.27-1.45-.42-1.39-.88.03-.24.36-.48 1-.72 3.94-1.72 6.57-2.85 7.89-3.39 3.76-1.55 4.54-1.82 5.05-1.83.11 0 .36.03.52.16.13.11.17.26.19.37z"/></svg>
                </div>
                <div>
                    <span class="block text-slate-500 text-xs font-medium mb-1">بوت المحاضرات</span>
                    <span class="block text-white font-bold tracking-wide">@Ans2co1bot</span>
                </div>
            </a>

            <a href="https://t.me/ll7ddd" target="_blank" class="contact-card shimmer flex-1 p-5 rounded-3xl flex items-center gap-4 text-right">
                <div class="p-3 bg-blue-500/10 rounded-2xl text-blue-400">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>

        </div>

        <p class="mt-16 text-slate-600 text-sm">الموقع راح يفتح بعد ما يكمل النظام تلقائيا</p>

    </div>

</body>
</html>
